[pytest]
# Repo root packages (connections, IRS, tools, annotations) are plain
# directories on sys.path, not an installed distribution -- this is what lets
# `import connections` work from inside tests/ without a src-layout install,
# mirroring how connections/test_framework.py does `sys.path.insert(0, ".")`.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: exercises real timing (echo intervals/timeouts) -- runs for real seconds, not mocked.

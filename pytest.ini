[pytest]
# `core` is an ordinary package rooted at the REPO ROOT (it has its own
# `core/__init__.py`), not a `sys.path` entry in its own right -- every
# internal module now imports absolutely as `core.connections...`,
# `core.IRS...`, `core.tools...`. So it's the repo root that has to be on
# `sys.path` for `import core` to resolve at all, which this ini file's own
# directory already is (`pythonpath = .`) -- mirroring how
# core/connections/test_framework.py bootstraps its own sys.path when run
# directly (inserts its grandparent, i.e. this same repo root).
pythonpath = .
testpaths = core/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: exercises real timing (echo intervals/timeouts) -- runs for real seconds, not mocked.
# core/connections/test_framework.py is a standalone manual smoke-test script
# (run directly, not with pytest -- see its own docstring), but its filename
# and `test_*` function names match pytest's default discovery globs. Without
# this, `pytest core` (passing an explicit path, which bypasses `testpaths`)
# would collect and run it too, coincidentally alongside this suite rather
# than by design.
addopts = --ignore=core/connections/test_framework.py
